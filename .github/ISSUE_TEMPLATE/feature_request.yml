name: "✨ Feature Request"
description: "Suggest a new feature or improvement"
title: "[Feature]: "
labels:
  - enhancement

body:
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Describe the pain point or issue.
      placeholder: What problem does this solve?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Explain the feature or improvement.
      placeholder: What should ZerithDB do?
    validations:
      required: true

  - type: textarea
    id: api_design
    attributes:
      label: API Design
      description: What would the ideal API look like?
      render: typescript
      placeholder: |
        // Example API here

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Other approaches you considered.
      placeholder: Why are they insufficient?

  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context
      description: Links, references, prior art, etc.
